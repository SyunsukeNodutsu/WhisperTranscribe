; WhisperTranscribe の設定ファイル
;
; 「文字起こし開始.cmd」を実行すると、ここに書いた内容が使われます。
; 行頭が ; の行はコメントなので無視されます。
; 値を空欄にした項目は、プログラム側の既定値のままになります。
; コマンドラインでオプションを付けた場合は、そちらが優先されます。
; 書き間違えた項目はその項目だけ無視され、起動時に警告が出ます。

[settings]

; ------------------------------ 表示 ------------------------------

; 認識した行をウィンドウにその場で表示する (true / false)
echo = true

; 行頭に [17:05:30] のような時刻を付ける (true / false)
timestamp = true

; --------------------------- 反応の速さ ---------------------------

; 無音がこのミリ秒続いたら、そこまでを認識に回す
; 小さいほど早く表示されるが、文が途中で切れやすくなる
;
; 実測した目安: 確実に区切れるのは「実際の無音 >= この値 + 50ms」のとき。
; 音量の判定が 25ms 刻みのため、息継ぎの前後が判定ブロックに食い込むぶん、
; 指定した値より少しだけ長い無音が必要になる
;   400 -> 450ms 以上の無音が必要 / 250 -> 300ms 以上 / 200 -> 250ms 以上
;
; 早口で一拍置かない講演では 400 だと息継ぎ(200-400ms)に届かず、
; 結局すべて max_segment の強制切断になる。強制切断は語の途中で切れるため、
; Whisper が末尾を「ご清聴ありがとうございました」等で埋めやすくなる
; （200 まで下げると過剰に切れ始めるので 250-300 が無難）
min_silence = 250

; 無音が来なくてもこの秒数で区切る
; BGM が鳴り続ける素材ではここが実際の待ち時間になる
; 逆に BGM のない講演などでは無音側が先に効くのでほとんど出番がない（保険）
; 目安: 25 = 精度優先 / 12 = ほどよい / 8 = 反応優先（30 超は Whisper 側で無意味）
max_segment = 25

; 発話とみなす音量の下限
; 小さくすると小さな音も拾うが、雑音も拾いやすくなる
; 実際のしきい値は「この値」と「無音区間から推定した暗騒音の 3 倍」の大きい方
; BGM のない収録で語尾や小声が落ちるなら 0.004 くらいまで下げる
threshold = 0.006

; ----------------------------- 認識 ------------------------------

; 固有名詞や専門用語を書いておくと、その語に寄せて認識する
; 「安心 → 単身」のような誤認識への対策はここが主役
; 例: prompt = アンリアルエンジン,シェーダー,ライトマップ
prompt =

; 言語  ja = 日本語 / en = 英語 / auto = 自動判定
language = ja

; モデル  large-v3 = 精度優先 / large-v3-turbo = 速度優先 / medium = 軽量
model = large-v3

; ビームサイズ。大きいほど丁寧に探すが遅くなる
beam = 5

; ----------------------------- 入力 ------------------------------

; 特定のアプリの音だけを文字起こしする。目印としてウィンドウタイトルの一部を書く
; 空欄なら PC で鳴っている音すべてが対象（従来どおりの動作）
; 指定できる名前は「文字起こし開始.cmd --list-apps」で確認できます
;
; 大文字小文字は区別せず、その文字列が含まれていれば一致とみなします
; 複数のアプリに一致したときは先頭が使われ、起動時に警告が出ます
;
; 注意: 拾えるのはアプリ単位で、ウィンドウやタブ単位では分けられません
;       Chrome を指定すると別タブ・別ウィンドウの音も混ざります
;       分けたいものは別のアプリで開いてください
;       例: 講演は Chrome、YouTube は Edge
;
; 例: app = Youtube
app =

; 自分のマイクも文字起こしして各行に [SYS] / [MIC] を付ける (true / false)
mic = false

; 録音元の再生デバイス名の一部。空欄なら Windows の既定の再生デバイス
; 使える名前は「文字起こし開始.cmd --list-devices」で確認できます
; 例: output_device = UAB-80
output_device =

; 使うマイク名の一部。空欄なら Windows の既定のマイク
mic_device =

; ---------------------------- その他 -----------------------------

; 保存先。空欄なら transcripts\日時.txt に自動で作る
out =

; 指定秒数で自動終了。0 なら Ctrl+C まで動き続ける
duration = 0

; 推論デバイス  cuda = GPU / cpu = CPU
device = cuda

; 演算精度。float16 が既定。int8_float16 にすると軽くなる
compute = float16
